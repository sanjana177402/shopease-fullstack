<!DOCTYPE html>
<html>
<head>
    <title>Orders - ShopEase</title>

    <style>
        body{
            font-family:'Segoe UI',sans-serif;
            background:#f5f5f5;
            margin:0;
        }

        
        .navbar{
            background:#08122f;
            color:white;
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h2{
            margin:0;
            font-size:34px;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:25px;
            font-size:18px;
            font-weight:500;
        }

        .navbar button{
            margin-left:25px;
            padding:10px 18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
        }

        
        .container{
            padding:40px;
        }

        h1{
            margin-bottom:30px;
            font-size:42px;
            color:#08122f;
        }

        
        .orders-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:30px;
        }

        
        .order-card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 5px 18px rgba(0,0,0,0.08);
            transition:0.3s;
            padding:18px;
        }

        .order-card:hover{
            transform:translateY(-6px);
        }

        .order-card img{
            width:100%;
            height:230px;
            object-fit:cover;
            border-radius:15px;
        }

        .order-content{
            margin-top:18px;
        }

        .order-id{
            font-size:28px;
            font-weight:bold;
            margin-bottom:14px;
            color:#08122f;
        }

        .status{
            display:inline-block;
            padding:7px 14px;
            border-radius:8px;
            font-size:15px;
            font-weight:600;
            margin-bottom:15px;
        }

        .placed{
            background:#e8f5e9;
            color:#2e7d32;
        }

        .shipped{
            background:#e3f2fd;
            color:#1565c0;
        }

        .delivered{
            background:#ede7f6;
            color:#5e35b1;
        }

        .cancelled{
            background:#ffebee;
            color:#c62828;
        }

        .price{
            font-size:34px;
            font-weight:bold;
            color:#08122f;
        }

        .empty{
            font-size:22px;
            color:gray;
        }
    </style>
</head>

<body onload="loadOrders()">

<!-- Navbar -->
<div class="navbar">

    <h2>🛍️ ShopEase</h2>

    <div>
        <a href="index.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>

        <button onclick="logout()">
            Logout
        </button>
    </div>

</div>

<!-- Content -->
<div class="container">

    <h1>Your Orders</h1>

    <div id="orders" class="orders-grid"></div>

</div>

<script>

let userId = localStorage.getItem("userId");

if(!userId){
    window.location.href = "login.html";
}


function loadOrders(){

    fetch(`http://127.0.0.1:8000/orders/?userId=${userId}`)

    .then(res => res.json())

    .then(data => {

        let html = "";

        if(data.length === 0){

            html = `
                <p class="empty">
                    No orders yet 😢
                </p>
            `;

        }

        else{

            data.reverse().forEach(order => {

                let statusClass = order.status;

                html += `

                    <div class="order-card">

                        <img src="${order.image}" alt="product">

                        <div class="order-content">

                            <div class="order-id">
                                Order #${order.id}
                            </div>

                            <div class="status ${statusClass}">
                                ${order.status}
                            </div>

                            <div class="price">
                                ₹${order.total_price.toLocaleString()}
                            </div>

                        </div>

                    </div>

                `;
            });
        }

        document.getElementById("orders").innerHTML = html;

    });

}


function logout(){

    localStorage.removeItem("userId");

    window.location.href = "login.html";
}

</script>

</body>
</html>
