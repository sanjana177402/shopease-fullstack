<!DOCTYPE html>
<html>

<head>

    <title>ShopEase Register</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f5f6fa;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .box{
            background:white;
            width:350px;
            padding:40px;

            border-radius:12px;

            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;

            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;

            background:#0f172a;
            color:white;

            border:none;
            border-radius:8px;

            cursor:pointer;
        }

        button:hover{
            background:#1e293b;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>Create Account</h2>

    <input 
        type="text" 
        id="username" 
        placeholder="Enter username"
    >

    <input 
        type="email" 
        id="email" 
        placeholder="Enter email"
    >

    <input 
        type="password" 
        id="password" 
        placeholder="Enter password"
    >

    <button onclick="registerUser()">
        Register
    </button>

    <p>
        Already have account?
        <a href="login.html">
            Login
        </a>
    </p>

</div>

<script>

async function registerUser() {

    const username = document.getElementById("username").value;

    const email = document.getElementById("email").value;

    const password = document.getElementById("password").value;

    const response = await fetch(
        "https://shopease-fullstack.onrender.com/users/register/",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                username,
                email,
                password
            })
        }
    );

    const data = await response.json();

    if(response.ok){

        alert("Registration successful 🎉");

        window.location.href = "login.html";

    } else {

        alert("Registration failed");
    }
}

</script>

</body>

</html>
