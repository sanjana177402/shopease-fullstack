<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>

    <style>
        body { font-family: Arial; margin: 0; background: #f5f6fa; }

        .navbar {
            background: #0f172a;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
        }

        .nav-links a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        .container {
            padding: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            margin-top: 8px;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove { background: red; color: white; }
    </style>
</head>

<body>

<div class="navbar">
    <h2>🛍 ShopEase</h2>
    <div class="nav-links">
        <a href="/">Products</a>
        <a href="/page/cart/">Cart</a>
        <a href="/wishlist/">Wishlist</a>
        <a href="/page/orders/">Orders</a>
    </div>
</div>

<div class="container">
    <h1>Your Wishlist ❤️</h1>
    <div id="wishlist"></div>
</div>

<script>
const userId = localStorage.getItem("userId");

if (!userId) window.location.href = "/login/";

async function loadWishlist() {
    const container = document.getElementById("wishlist");
    container.innerHTML = "<p>Loading...</p>";

    const res = await fetch(`https://shopease-fullstack.onrender.com/wishlist-api/?userId=${userId}`);
    const items = await res.json();

    if (items.length === 0) {
        container.innerHTML = "<p>No items in wishlist 😢</p>";
        return;
    }

    container.innerHTML = "<div class='grid'>" + items.map(p => `
        <div class="card">
            <img src="${p.image}" />
            <h3>${p.name}</h3>
            <p>₹${p.price}</p>
            <button class="remove" onclick="removeItem(${p.productId})">
                Remove
            </button>
        </div>
    `).join("") + "</div>";
}

async function removeItem(productId) {
    await fetch(`https://shopease-fullstack.onrender.com/wishlist-api/${productId}/?userId=${userId}`, {
        method: "DELETE"
    });
    loadWishlist();
}

loadWishlist();
</script>

</body>
</html>
