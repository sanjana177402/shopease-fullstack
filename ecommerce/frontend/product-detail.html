<!DOCTYPE html>
<html>
<head>
    <title>Product Detail - ShopEase</title>
    <style>
        body { margin:0; font-family:Arial; background:#f5f6fa; }
        .navbar {
            background:#0f172a;
            color:white;
            padding:15px 40px;
            display:flex;
            justify-content:space-between;
        }
        .nav-links a { color:white; margin-left:20px; text-decoration:none; }
        .container { padding:40px; max-width:800px; margin:auto; }
        .product-box {
            background:white;
            padding:30px;
            border-radius:12px;
            display:flex;
            gap:30px;
        }
        img { width:300px; height:300px; object-fit:cover; border-radius:10px; }
        .details h1 { margin-top:0; }
        .btn {
            background:black;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            margin-right:10px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/" style="color:white; text-decoration:none;"><h2>🛍 ShopEase</h2></a>
    <div class="nav-links">
        <a href="/page/cart/">Cart</a>
        <a href="/wishlist/">Wishlist ❤️</a>
        <a href="/page/orders/">Orders</a>
    </div>
</div>

<div class="container">
    <div id="productDetail">Loading...</div>
</div>

<script>
const userId = localStorage.getItem("userId");
const productId = window.location.pathname.split("/")[3];

async function loadProduct() {
    const res = await fetch(`https://shopease-fullstack.onrender.com/products/${productId}/`);
    const p = await res.json();

    document.getElementById("productDetail").innerHTML = `
        <div class="product-box">
            <img src="${p.image}" />
            <div class="details">
                <h1>${p.name}</h1>
                <p><b>Price:</b> ₹${p.price}</p>
                <p><b>Stock:</b> ${p.stock} items left</p>
                <p><b>Category:</b> ${p.category}</p>
                <p><b>Description:</b> ${p.description}</p>
                <button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>
                <button class="btn" onclick="addToWishlist(${p.id})">❤️ Wishlist</button>
            </div>
        </div>
    `;
}

function addToCart(productId) {
    if (!userId) {
        alert("Please login to add to cart!");
        window.location.href = "/login/";
        return;
    }
    fetch("https://shopease-fullstack.onrender.com/cart/add/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, productId, quantity: 1 })
    });
    alert("Added to cart!");
}

async function addToWishlist(productId) {
    if (!userId) {
        alert("Please login first!");
        window.location.href = "/login/";
        return;
    }
    const res = await fetch("https://shopease-fullstack.onrender.com/wishlist-api/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, productId })
    });
    const data = await res.json();
    alert(data.message + " ❤️");
}

loadProduct();
</script>

</body>
</html>
