<!DOCTYPE html>
<html>
<head>
    <title>Payment - ShopEase</title>

    <style>

        body{
            margin:0;
            font-family:'Segoe UI',sans-serif;
            background:#f5f5f5;
        }

        
        .navbar{
            background:#08122f;
            color:white;
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h2{
            margin:0;
            font-size:34px;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:22px;
            font-size:18px;
            font-weight:500;
        }


        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:85vh;
        }

        
        .payment-box{
            background:white;
            width:430px;
            padding:35px;
            border-radius:24px;
            box-shadow:0 6px 18px rgba(0,0,0,0.08);
        }

        .payment-box h1{
            margin-top:0;
            margin-bottom:25px;
            color:#08122f;
            font-size:42px;
        }

        .total{
            font-size:34px;
            font-weight:bold;
            color:#08122f;
            margin-bottom:28px;
        }

        .payment-box input{
            width:100%;
            padding:15px;
            margin-bottom:18px;
            border-radius:12px;
            border:1px solid #ddd;
            font-size:16px;
            box-sizing:border-box;
        }

        .payment-box h3{
            margin-top:10px;
            color:#08122f;
        }

        
        .payment-methods{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-bottom:20px;
        }

        .method{
            padding:12px 18px;
            border:2px solid #ddd;
            border-radius:10px;
            cursor:pointer;
            transition:0.3s;
            font-weight:600;
            background:#f8f8f8;
        }

        .method:hover{
            border-color:#08122f;
        }

        .method.active{
            background:#08122f;
            color:white;
            border-color:#08122f;
        }

        #selectedMethod{
            font-weight:600;
            color:#08122f;
            margin-bottom:20px;
        }

        
        .payment-box button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:12px;
            background:#08122f;
            color:white;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        .payment-box button:hover{
            background:#16255f;
        }

    
        .success{
            text-align:center;
            color:green;
            font-size:22px;
            margin-top:20px;
            display:none;
            font-weight:600;
        }

        
        .secure{
            text-align:center;
            color:gray;
            margin-top:15px;
            font-size:15px;
        }

    </style>
</head>

<body>


<div class="navbar">

    <h2>🛍️ ShopEase</h2>

    <div>
        <a href="index.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
    </div>

</div>


<div class="container">

    <div class="payment-box">

        <h1>Payment</h1>

        
        <div class="total" id="totalAmount">
            ₹0
        </div>

        
        <input type="text"
               placeholder="Card Holder Name"
               value="Sanjana Dev">

        <input type="text"
               placeholder="Card Number"
               value="4587 2145 8899 6321">

        <input type="text"
               placeholder="Expiry Date"
               value="12/28">

        <input type="password"
               placeholder="CVV"
               value="457">

        
        <h3>UPI Payment</h3>

        <input type="text"
               placeholder="Enter UPI ID"
               value="sanjana@ybl">

        
        <h3>Select Payment Method</h3>

        <div class="payment-methods">

            <div class="method active"
                 onclick="selectMethod(this,'Card')">
                 💳 Card
            </div>

            <div class="method"
                 onclick="selectMethod(this,'UPI')">
                 💰 UPI
            </div>

            <div class="method"
                 onclick="selectMethod(this,'Paytm')">
                 📱 Paytm
            </div>

            <div class="method"
                 onclick="selectMethod(this,'PhonePe')">
                 🟣 PhonePe
            </div>

        </div>

        <p id="selectedMethod">
            Selected Payment: Card
        </p>

        <!-- Pay Button -->
        <button onclick="payNow()">
            Pay Now
        </button>

        <!-- Success -->
        <div class="success" id="successMsg">
            Payment Successful ✅
        </div>

        <!-- Secure -->
        <p class="secure">
            🔒 100% Secure Payment
        </p>

    </div>

</div>

<script>
let total = localStorage.getItem("cartTotal") || 0;

document.getElementById("totalAmount").innerText =
    "₹" + total;



let paymentType = "Card";

function selectMethod(element,type){

    paymentType = type;

    document.querySelectorAll(".method")
    .forEach(btn => {
        btn.classList.remove("active");
    });

    element.classList.add("active");

    document.getElementById("selectedMethod")
    .innerText =
    "Selected Payment: " + type;

}

function payNow(){

    document.getElementById("successMsg").style.display =
    "block";

    fetch("http://127.0.0.1:8000/orders/",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            userId:localStorage.getItem("userId")
        })

    })

    .then(res => res.json())

    .then(data => {

        console.log(data);

        setTimeout(function(){

            window.location.href = "orders.html";

        },2000);

    })

    .catch(error => {

        console.log(error);

        alert("Order creation failed ❌");

    });

}



</script>

</body>
</html>
