<!DOCTYPE html>
<html>
<head>
  <title>Cart • ShopEase</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #0f172a;
      --accent: #16a34a;
      --danger: #dc2626;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* NAV */
    .nav {
      background: #000;
      color: #fff;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav a, .nav button {
      color: #fff;
      text-decoration: none;
      margin-left: 18px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    
    .wrap {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
    }

    h1 { margin: 10px 0 16px; }

   
    .list { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      padding: 16px;
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 16px;
      align-items: center;
      transition: .2s ease;
    }
    .card:hover { transform: translateY(-3px); }

    .img {
      width: 90px; height: 90px;
      border-radius: 10px;
      background: #eef2ff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .img img { width: 100%; height: 100%; object-fit: cover; }

    .title { font-size: 16px; font-weight: 600; }
    .price { color: var(--brand); font-weight: 600; margin-top: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .actions {
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
    }

    .qty {
      display: flex; align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .qty button {
      width: 34px; height: 34px;
      border: none; background: #f1f5f9; cursor: pointer;
      font-size: 16px;
    }
    .qty span {
      width: 38px; text-align: center; font-weight: 600;
    }

    .remove {
      border: none;
      background: #fee2e2;
      color: var(--danger);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    
    .summary {
      position: sticky; top: 20px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      padding: 18px;
      height: fit-content;
    }
    .sum-row {
      display: flex; justify-content: space-between;
      margin-bottom: 10px;
      color: var(--muted);
    }
    .sum-total {
      display: flex; justify-content: space-between;
      font-size: 20px; font-weight: 700;
      margin-top: 12px;
    }
    .checkout {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    /* STATES */
    .center {
      text-align: center; color: var(--muted);
      padding: 40px 0;
    }

    
    #toast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #0f172a; color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

<div class="nav">
  <h3>🛍 ShopEase</h3>
  <div>
    <a href="index.html">Products</a>
    <a href="orders.html">Orders</a>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="wrap">
  <div>
    <h1>Your Cart</h1>
    <div id="cartList" class="list"></div>
  </div>

  <div class="summary">
    <div class="sum-row">
      <span>Items</span>
      <span id="itemCount">0</span>
    </div>
    <div class="sum-total">
      <span>Total</span>
      <span id="totalPrice">₹0</span>
    </div>
    <button class="checkout" onclick="placeOrder()">Place Order</button>
  </div>
</div>

<div id="toast"></div>

<script>
const userId = localStorage.getItem("userId");
if (!userId) window.location.href = "login.html";

async function loadCart() {
  const container = document.getElementById("cartList");
  container.innerHTML = "<div class='center'>Loading...</div>";

  try {
    const res = await fetch(`http://127.0.0.1:8000/cart/?userId=${userId}`);
    const data = await res.json();

    container.innerHTML = "";

    if (!data.items || data.items.length === 0) {
      container.innerHTML = "<div class='center'>Your cart is empty 🛒</div>";
      document.getElementById("totalPrice").innerText = "₹0";
      document.getElementById("itemCount").innerText = "0";
      return;
    }

    let count = 0;

    data.items.forEach(item => {
      count += item.quantity;

      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <div class="img">
          <img src="${item.image || 'https://via.placeholder.com/100'}"/>
        </div>

        <div>
          <div class="title">${item.name}</div>
          <div class="price">₹${item.price}</div>
          <div class="sub">Total: ₹${item.total}</div>
        </div>

        <div class="actions">
          <div class="qty">
            <button onclick="updateQty(${item.productId}, ${item.quantity-1})">-</button>
            <span>${item.quantity}</span>
            <button onclick="updateQty(${item.productId}, ${item.quantity+1})">+</button>
          </div>
          <button class="remove" onclick="removeItem(${item.productId})">Remove</button>
        </div>
      `;

      container.appendChild(div);
    });

    document.getElementById("totalPrice").innerText = "₹" + data.totalPrice;
    document.getElementById("itemCount").innerText = count;

  } catch {
    container.innerHTML = "<div class='center'>Failed to load cart ❌</div>";
  }
}

async function updateQty(productId, qty) {
  if (qty < 1) return;

  await fetch("http://127.0.0.1:8000/cart/update/", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userId, productId, quantity: qty })
  });

  showToast("Updated ✨");
  loadCart();
}

async function removeItem(productId) {
  await fetch(`http://127.0.0.1:8000/cart/remove/${productId}/?userId=${userId}`, {
    method: "DELETE"
  });

  showToast("Removed ❌");
  loadCart();
}

function placeOrder(){

    localStorage.setItem(
        "cartTotal",
        document.getElementById("totalPrice").innerText.replace("₹","")
    );

    window.location.href = "payment.html";
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

function logout() {
  localStorage.removeItem("userId");
  window.location.href = "login.html";
}

loadCart();
</script>

</body>
</html>
