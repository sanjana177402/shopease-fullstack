<!DOCTYPE html>
<html>
<head>
    <title>ShopEase - Products</title>
    <style>
        body { margin:0; font-family:Arial; background:#f5f6fa; }
        .navbar {
            background:#0f172a;
            color:white;
            padding:15px 40px;
            display:flex;
            justify-content:space-between;
        }
        .nav-links a {
            color:white;
            margin-left:20px;
            text-decoration:none;
        }
        .container { padding:30px 40px; }
        .controls {
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }
        input, select {
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }
        .grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
            gap:20px;
        }
        .card {
            background:white;
            padding:15px;
            border-radius:12px;
            cursor:pointer;
        }
        .product-img {
            width:100%;
            height:150px;
            object-fit:cover;
            border-radius:8px;
        }
        .btn {
            background:black;
            color:white;
            padding:6px 10px;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="/" style="color:white; text-decoration:none;"><h2>🛍 ShopEase</h2></a>
    <div class="nav-links">
        <a href="/page/cart/">Cart</a>
        <a href="/wishlist/">Wishlist ❤️</a>
        <a href="/page/orders/">Orders</a>
    </div>
</div>

<div class="container">
    <h1>Products</h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search..." onkeyup="resetAndLoad()">

        <select id="categoryFilter" onchange="resetAndLoad()">
            <option value="">All Categories</option>
        </select>

        <select id="sortOption" onchange="resetAndLoad()">
            <option value="">Sort</option>
            <option value="low">Price Low → High</option>
            <option value="high">Price High → Low</option>
        </select>
    </div>

    <div class="grid" id="productList"></div>

    <div style="margin-top:20px;">
        <button class="btn" onclick="prevPage()">Previous</button>
        <button class="btn" onclick="nextPage()">Next</button>
    </div>
</div>

<script>
const userId = localStorage.getItem("userId");
let currentPage = 1;

// Fix 4: Load categories dynamically from API
async function loadCategories() {
    const res = await fetch("https://shopease-fullstack.onrender.com/categories/");
    const categories = await res.json();
    const select = document.getElementById("categoryFilter");
    categories.forEach(cat => {
        select.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
    });
}

function resetAndLoad() {
    currentPage = 1;
    loadProducts();
}

async function loadProducts() {
    const search = document.getElementById("searchInput").value;
    const category = document.getElementById("categoryFilter").value;
    const sort = document.getElementById("sortOption").value;

    let url = `https://shopease-fullstack.onrender.com/products/?page=${currentPage}`;
    if (search) url += `&search=${search}`;
    if (category) url += `&category=${encodeURIComponent(category)}`;
    if (sort) url += `&sort=${sort}`;

    const res = await fetch(url);
    const data = await res.json();
    renderProducts(data);
}

function renderProducts(products) {
    const container = document.getElementById("productList");
    container.innerHTML = "";

    if (products.length === 0) {
        container.innerHTML = "<p>No products found 😢</p>";
        return;
    }

    products.forEach(p => {
        container.innerHTML += `
            <div class="card" onclick="window.location.href='/page/product/${p.id}/'">
                <img src="${p.image}" class="product-img"/>
                <h3>${p.name}</h3>
                <p>₹${p.price}</p>
                <button class="btn" onclick="event.stopPropagation(); addToCart(${p.id})">Add to Cart</button>
                <button onclick="event.stopPropagation(); addToWishlist(${p.id})">❤️</button>
            </div>
        `;
    });
}

function addToCart(productId) {
    if (!userId) {
        alert("Please login to add to cart!");
        window.location.href = "/login/";
        return;
    }
    fetch("https://shopease-fullstack.onrender.com/cart/add/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, productId, quantity: 1 })
    });
    alert("Added to cart!");
}

async function addToWishlist(productId) {
    if (!userId) {
        alert("Please login first!");
        window.location.href = "/login/";
        return;
    }
    const res = await fetch("https://shopease-fullstack.onrender.com/wishlist-api/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, productId })
    });
    const data = await res.json();
    alert(data.message + " ❤️");
}

function nextPage() {
    currentPage++;
    loadProducts();
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        loadProducts();
    }
}

loadCategories();
loadProducts();
</script>

</body>
</html>
